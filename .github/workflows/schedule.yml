# Daily full ingest: scrape -> normalize -> chunk -> embed -> local Chroma upsert.
name: Daily ingest (09:15 IST)

on:
  schedule:
    # 03:45 UTC == 09:15 IST (Asia/Kolkata, year-round)
    - cron: "45 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily-ingest:
    name: Scrape -> Parse -> Chunk -> Embed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface

    defaults:
      run:
        working-directory: ./hdfc-rag-chatbot

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('hdfc-rag-chatbot/requirements.txt') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Scrape URLs
        run: python3 -m scraper.groww_scraper

      - name: Parse and Normalize HTML
        if: success()
        run: python3 -m scraper.parser

      - name: Chunking
        if: success()
        run: python3 -m indexer.chunker

      - name: Create Vector Store
        if: success()
        run: python3 -m indexer.vector_store

      - name: Create BM25 Index
        if: success()
        run: python3 -m indexer.bm25_index

      - name: Upload Data Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-data-${{ github.run_id }}
          path: hdfc-rag-chatbot/data/
          if-no-files-found: warn
          retention-days: 14
